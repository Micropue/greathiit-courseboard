name: Build and Release

on:
  push:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: xcode-27

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test --disable-sandbox

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            NAME="哈信息课程表 ${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            TAG="build-${GITHUB_RUN_NUMBER}"
            NAME="哈信息课程表自动构建 #${GITHUB_RUN_NUMBER}"
            PRERELEASE="true"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build application
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Package application
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release.outputs.version }}"
          APP="dist/哈信息课程表.app"
          ARCHIVE="dist/greathiit-courseboard-${VERSION}.zip"
          CHECKSUM="${ARCHIVE}.sha256"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee "$CHECKSUM"

          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
